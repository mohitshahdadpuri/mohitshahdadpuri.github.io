<html lang="en">
<head>
<meta charset="utf-8">

<title>Core Lockdown: Logic Puzzles</title>
<meta name="description" content="Core Lockdown: Logic Puzzles, a sci-fi logic puzzle game for Android.">
<style>
  :root { --bg: #0b1020; --panel: #141b33; --text: #e8ecf8; --muted: #9aa6c4; --accent: #20d9e8; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 34rem; width: 100%; background: var(--panel); border: 1px solid #25304f; border-radius: 16px; padding: 28px 24px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: .02em; }
  .tag { margin: 0 0 18px; color: var(--accent); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; }
  p { margin: 0 0 14px; color: var(--muted); }
  ul { list-style: none; margin: 18px 0 0; padding: 0; display: grid; gap: 8px; }
  a { color: var(--accent); }
  li { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Core Lockdown: Logic Puzzles</h1>
  <p class="tag">Android game</p>
  <p>A sci-fi logic puzzle game. Break the lockdown one board at a time, across a 60-level campaign, a daily puzzle and free play. For players aged 13 and over.</p>
